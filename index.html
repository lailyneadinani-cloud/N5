<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B3A9E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="N5">
<title>Kana et Kanji N5</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Concept : cahier d'écriture japonais. Une colonne de travail, onglets soulignés, cartes carrées avec guide en croix comme sur le papier quadrillé des écoliers. */
:root{
  --bg:#EEF0F6; --surface:#FFFFFF; --fg:#161A2B; --muted:#5A607A; --line:#D5D9E6;
  --accent:#2B3A9E; --accent-fg:#FFFFFF; --tint:#E4E8F9; --guide:#C3C9DE;
  --seal:#C6432B; --seal-fg:#FFFFFF;
  --guide2:color-mix(in srgb,var(--guide) 65%,transparent);
  --cross:linear-gradient(var(--guide2),var(--guide2)) center/100% 1px no-repeat,linear-gradient(var(--guide2),var(--guide2)) center/1px 100% no-repeat;
  --good:#23754F; --good-bg:#DDF1E6; --bad:#A93434; --bad-bg:#F8E0E0;
  --f-jp:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1220; --surface:#181C30; --fg:#E8EAF5; --muted:#9AA1BE; --line:#2B3150;
    --accent:#8E9BFF; --accent-fg:#0F1220; --tint:#232951; --guide:#3A4168; --seal:#E2705A; --seal-fg:#1B0F0C;
    --good:#5CC38F; --good-bg:#16382A; --bad:#F08383; --bad-bg:#40202A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1220; --surface:#181C30; --fg:#E8EAF5; --muted:#9AA1BE; --line:#2B3150;
  --accent:#8E9BFF; --accent-fg:#0F1220; --tint:#232951; --guide:#3A4168; --seal:#E2705A; --seal-fg:#1B0F0C;
  --good:#5CC38F; --good-bg:#16382A; --bad:#F08383; --bad-bg:#40202A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-ui);padding-block:20px 56px;padding-inline:16px}
.wrap{max-width:980px;margin-inline:auto;display:flex;flex-direction:column;gap:22px}
.jp{font-family:var(--f-jp)}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font-family:inherit}

header.top{display:flex;align-items:center;gap:16px;position:relative;min-height:96px;padding-right:44px}
.stamp{width:52px;height:52px;flex:none;background:var(--seal);color:var(--seal-fg);border-radius:6px;display:grid;place-items:center;font:600 30px/1 var(--f-jp);transform:rotate(-4deg)}
h1{font:600 30px/1.1 var(--f-jp);letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:5px}
.vert{position:absolute;right:0;top:0;writing-mode:vertical-rl;font:600 30px/1 var(--f-jp);letter-spacing:.14em;color:var(--guide);user-select:none;pointer-events:none}

nav.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:8px 16px;display:flex;align-items:center;gap:10px;font:500 15px var(--f-ui);color:var(--muted);cursor:pointer;white-space:nowrap}
.tab .ic{font:600 24px/1 var(--f-jp)}
.tab[aria-selected="true"]{color:var(--fg);font-weight:700;border-bottom-color:var(--accent)}
.tab[aria-selected="true"] .ic{color:var(--accent)}
@media (max-width:640px){
  body{padding-block:20px 100px}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);border-bottom:0;gap:0;padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(7,1fr)}
  .tab{flex-direction:column;justify-content:center;gap:2px;padding:8px 1px;margin:0;font-size:9.5px;border-bottom:0;border-top:3px solid transparent}
  .tab[aria-selected="true"]{border-bottom-color:transparent;border-top-color:var(--accent)}
}

.view{display:flex;flex-direction:column;gap:20px;min-width:0}
[hidden]{display:none!important}
.intro{color:var(--muted);max-width:62ch}

.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);align-self:flex-start}
.seg button{appearance:none;border:0;background:none;padding:9px 14px;min-height:40px;font:500 14px var(--f-ui);color:var(--fg);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:700}

.groups{display:flex;flex-wrap:wrap;gap:28px 44px}
.group{flex:1 1 300px;max-width:460px;min-width:0}
.group h3{font:700 15px var(--f-ui);margin-bottom:10px;display:flex;gap:8px;align-items:baseline}
.group h3 small,.chip small{color:var(--muted);font-weight:500;font-size:12px}
.kgrid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:6px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 5px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.kc.empty{background:none;border-color:transparent}
.kc .ch{width:100%;aspect-ratio:1/1;display:grid;place-items:center;font-size:clamp(24px,7vw,34px);line-height:1;background:var(--cross);border-radius:4px}
.kc .ro{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.searchrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.searchrow input{flex:1 1 260px;max-width:420px;min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:15px var(--f-ui)}
.searchrow span{color:var(--muted);font-size:13px}
.kgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.kt{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:12px;align-items:center;min-width:0}
.kt .kch{width:64px;height:64px;flex:none;display:grid;place-items:center;font-size:42px;line-height:1;background:var(--cross);border:1px solid var(--line);border-radius:6px}
.kt .kbody{min-width:0;display:flex;flex-direction:column;gap:1px}
.kt .kfr{font-weight:700}
.kt .kr{font-size:13px;color:var(--muted)}
.kt .kr b{display:inline-block;min-width:30px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:700}
.none{color:var(--muted)}

.picker{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.prow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.plabel{width:84px;flex:none;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.chip{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:6px 13px;min-height:36px;font:500 14px var(--f-ui);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--tint);border-color:var(--accent);color:var(--fg);font-weight:700;box-shadow:inset 0 0 0 1px var(--accent)}
.opts{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.check{display:inline-flex;gap:8px;align-items:center;font-size:14px;cursor:pointer;min-height:40px}
.check input{width:18px;height:18px;accent-color:var(--accent)}

.stage{max-width:440px;width:100%;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
.progress{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .25s}
.prog-l{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.card{appearance:none;position:relative;width:100%;aspect-ratio:1/1;max-height:72vh;background:var(--surface);border:2px solid var(--fg);border-radius:6px;box-shadow:7px 7px 0 var(--tint);color:var(--fg);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;text-align:center}
.card.guide,.prompt.guide{background-image:
  repeating-linear-gradient(90deg,var(--guide) 0 6px,transparent 6px 12px),
  repeating-linear-gradient(0deg,var(--guide) 0 6px,transparent 6px 12px),
  linear-gradient(to top right,transparent calc(50% - .5px),var(--guide2) calc(50% - .5px) calc(50% + .5px),transparent calc(50% + .5px)),
  linear-gradient(to bottom right,transparent calc(50% - .5px),var(--guide2) calc(50% - .5px) calc(50% + .5px),transparent calc(50% + .5px));
  background-size:calc(100% - 28px) 1px,1px calc(100% - 28px),100% 100%,100% 100%;
  background-position:center;background-repeat:no-repeat}
.card.anim{animation:cardin .3s ease-out}
@keyframes cardin{from{transform:perspective(800px) rotateY(75deg);opacity:.3}to{transform:perspective(800px) rotateY(0);opacity:1}}
.tag{position:absolute;top:12px;left:14px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--seal);font-weight:700}
.hint{position:absolute;bottom:12px;left:0;right:0;font-size:12px;color:var(--muted)}
.glyph{font-size:clamp(88px,32vw,150px);line-height:1;position:relative}
.ans-big{font:700 clamp(46px,15vw,68px)/1.1 var(--f-ui)}
.ans-fr{font:700 clamp(22px,7vw,30px)/1.25 var(--f-ui);text-wrap:balance}
.reads{font-size:14px;color:var(--muted);line-height:1.6}
.reads b{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:6px}

.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1 1 150px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;min-height:48px;padding:10px 16px;font:700 15px var(--f-ui);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.good{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.btn.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.result{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.score{display:flex;align-items:baseline;gap:10px;color:var(--muted)}
.score .big{font:600 64px/1 var(--f-jp);color:var(--fg);font-variant-numeric:tabular-nums}
.result h3{font:700 15px var(--f-ui)}
.miss{display:flex;flex-wrap:wrap;gap:6px}
.mc{display:inline-flex;flex-direction:column;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:56px;max-width:100%}
.mc .jp{font-size:26px;line-height:1.2}
.mc small{font-size:12px;color:var(--muted);text-align:center}
.empty-msg{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:18px;text-align:center}

.opt-block{display:flex;flex-direction:column;gap:8px}
.opt-block .lab{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.prompt{position:relative;background:var(--surface);border:2px solid var(--fg);border-radius:6px;box-shadow:7px 7px 0 var(--tint);min-height:190px;padding:34px 18px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.qlabel{color:var(--muted);font-size:14px;text-align:center}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{appearance:none;display:flex;align-items:center;gap:10px;min-height:64px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--fg);cursor:pointer;text-align:left;font:500 16px var(--f-ui);min-width:0}
.choice .n{flex:none;width:22px;height:22px;border-radius:6px;background:var(--tint);color:var(--accent);font:700 12px/22px var(--f-ui);text-align:center}
.choice .t{flex:1;min-width:0;overflow-wrap:anywhere}
.choice .t.jp{font-size:34px;line-height:1.1;text-align:center}
.choice.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.choice.ko{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.choice.dim{opacity:.55}
.fb{font-weight:700;text-align:center}
.fb.ok{color:var(--good)}.fb.ko{color:var(--bad)}

/* Lecture : texte sur papier réglé */
.stage.wide{max-width:640px}
.paper{position:relative;background:var(--surface);border:2px solid var(--fg);border-radius:6px;box-shadow:7px 7px 0 var(--tint);padding:40px 20px 14px}
.paper .tag{top:14px}
.txt{font:400 clamp(20px,5.4vw,24px)/2.5 var(--f-jp);white-space:pre-line;overflow-wrap:anywhere;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(2.5em - 1px),var(--guide2) calc(2.5em - 1px),var(--guide2) 2.5em)}
.txt rt{font:400 .46em/1 var(--f-jp);color:var(--muted);letter-spacing:.02em}
.txt.nofuri rt{display:none}
.rtools{display:flex;justify-content:flex-end;align-items:center;gap:10px}
.chip .fk{font-family:var(--f-jp);margin-right:6px;font-weight:600}
.tr{background:var(--tint);border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.55}
.tr b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.choices.rd .choice{min-height:56px;font-size:15px}
.mlist{display:flex;flex-direction:column;gap:8px}
.mt{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.mt .txt{font-size:18px;line-height:2.2;background:none}
.mt small{display:block;color:var(--muted);font-size:13px;line-height:1.45}

/* Vocabulaire */
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.xcard{appearance:none;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:76px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;cursor:pointer;color:var(--fg);font:inherit}
.xcard .xn{grid-row:1/3;font:700 26px var(--f-jp);color:var(--accent);min-width:1.4em;text-align:center}
.xcard .xt{font-weight:700;font-size:15px}
.xcard small{color:var(--muted);font-size:12.5px}
.xcard.done{border-color:var(--good)}
.xcard.done .xn{color:var(--good)}
.xhead{background:var(--tint);border-radius:8px;padding:10px 14px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.xhead small{color:var(--muted)}
.xrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.xrow .progress{grid-column:1/3}
.phero{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px}
.phero .big{font:700 clamp(44px,14vw,64px)/1 var(--f-jp);color:var(--accent)}
.phero p{margin:0;line-height:1.6}
.ppath{display:flex;flex-direction:column}
.pstep{display:grid;grid-template-columns:36px 1fr;gap:14px;padding-bottom:18px;position:relative}
.pstep:not(:last-child)::before{content:"";position:absolute;left:17px;top:38px;bottom:2px;width:2px;background:var(--line)}
.pnum{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:700 15px var(--f-ui);background:var(--bg);color:var(--muted)}
.pstep.run .pnum{border-color:var(--accent);color:var(--accent)}
.pstep.done .pnum{background:var(--good);border-color:var(--good);color:#fff}
.pbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.pbody h3{margin:0;font:700 17px var(--f-ui)}
.pbody small{color:var(--muted);font-size:13px;line-height:1.5}
.pnote{background:var(--tint);border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.6}
.phist{display:flex;flex-direction:column;gap:4px;font-size:14px}
.phist div{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.phist small{color:var(--muted)}
.gl{display:flex;flex-direction:column;gap:10px}
.gl h3{margin:14px 0 2px;font:700 13px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
details.gless{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.gless>summary{list-style:none;cursor:pointer;padding:12px 14px;min-height:48px;display:flex;flex-direction:column;gap:2px}
details.gless>summary::-webkit-details-marker{display:none}
details.gless>summary b{font:700 16px var(--f-jp)}
details.gless>summary small{color:var(--muted);font-size:13px}
details.gless[open]>summary{border-bottom:1px solid var(--line)}
.gbody{padding:14px;display:flex;flex-direction:column;gap:12px}
.gform{font:600 17px var(--f-jp);background:var(--tint);border-radius:8px;padding:10px 12px}
.gexp{line-height:1.7;font-size:15px}
.gex{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px dashed var(--line)}
.gex .jp{font-size:19px;line-height:2}.gex small{color:var(--muted);font-size:14px}
.blank{display:inline-block;min-width:2.4em;border-bottom:2px solid var(--accent);text-align:center;color:var(--accent)}
.gq{font:500 22px/2.1 var(--f-jp);text-align:center}
.vpick{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.vpick-h{appearance:none;width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;min-height:48px;background:none;border:0;color:var(--fg);font:500 14px var(--f-ui);cursor:pointer;text-align:left}
.vpick-h .chev{color:var(--muted);transition:transform .2s}
.vpick-h[aria-expanded="true"] .chev{transform:rotate(180deg)}
.vpick-b{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.vchips{display:flex;flex-wrap:wrap;gap:6px}
#vlist{display:flex;flex-direction:column;gap:24px}
.vsec{display:flex;flex-direction:column;gap:10px}
.vsec h3{font:700 15px var(--f-ui);display:flex;gap:8px;align-items:baseline}
.vsec h3 small{color:var(--muted);font-weight:500;font-size:12px}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.vw{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:12px;align-items:center;min-width:0}
.vjp{flex:none;min-width:60px;max-width:46%;font-size:30px;line-height:1.15;text-align:center;overflow-wrap:anywhere}
.vjp.long{font-size:18px}
.vbody{min-width:0;display:flex;flex-direction:column;gap:1px}
.vfr{font-weight:700;overflow-wrap:anywhere}
.vrd{font-size:13px;color:var(--muted)}
.vg{display:inline-block;margin-left:6px;padding:0 6px;border-radius:4px;background:var(--tint);color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.04em;vertical-align:middle}
.card.vc{aspect-ratio:4/3}
.card .tag{max-width:calc(100% - 28px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.vbig{font-size:clamp(44px,14vw,70px);line-height:1.15;overflow-wrap:anywhere}
.vbig.long{font-size:clamp(24px,7.5vw,36px)}
.vrd2{font-size:20px;color:var(--muted)}
.choice .t.jp.sm{font-size:20px;line-height:1.25}

@media (max-width:480px){
  .choices.rd{grid-template-columns:1fr}
}
@media (max-width:420px){
  .plabel{width:100%}
  .choice{min-height:60px;padding:8px 10px}
}
@media (prefers-reduced-motion:reduce){.progress span{transition:none}.card.anim{animation:none}}
</style>

<div class="wrap">
  <header class="top">
    <div class="stamp" aria-hidden="true">五</div>
    <div>
      <h1>Kana et Kanji N5</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="vert" aria-hidden="true">日本語</div>
  </header>

 ["g01","Bases","XはYです : présenter, définir","N1 は N2 です","**です** est la forme polie du verbe « être ». **は** (écrit は, lu **wa**) marque le thème : ce dont on parle.\nIl n'y a ni article ni pluriel : 「本です」 peut vouloir dire « c'est un livre » ou « ce sont des livres ».\nLe verbe ou です est toujours à la fin de la phrase.",

 ["g02","Bases","XはYでした : le passé de です","N1 は N2 でした","**でした** est le passé poli de です. Le négatif passé est **じゃありませんでした** (ou ではありませんでした).\nDes mots comme **きのう** (hier) ou **せんしゅう** (la semaine dernière) annoncent souvent un passé.",

 ["g03","Bases","La négation : じゃありません","N1 は N2 じゃありません","**じゃありません** (oral) ou **ではありません** (plus formel) nie です au présent.\nPour le passé négatif, on ajoute でした : じゃありませんでした.",

 ["g04","Bases","Poser une question : か","…ですか ／ …ますか","**か** à la fin de la phrase la transforme en question. L'ordre des mots ne change pas.\nMots interrogatifs : **なに／なん** (quoi), **だれ** (qui), **どこ** (où), **いつ** (quand), **いくら** (combien, prix), **どう** (comment), **なんじ** (quelle heure).",

 ["g05","Bases","これ・それ・あれ et この・その・あの","これ／それ／あれ／どれ ・ この／その／あの／どの + nom","Quatre séries selon la distance : **こ** (près de moi), **そ** (près de toi), **あ** (loin des deux), **ど** (interrogatif).\n**これ・それ・あれ・どれ** remplacent un nom ; **この・その・あの・どの** sont toujours suivis d'un nom. Pour les lieux : **ここ・そこ・あそこ・どこ**.",

 ["g06","Particules","の et も : relier, ajouter","N1 の N2 ／ N も","**の** relie deux noms : possession, appartenance, nature (« de »). 「わたしの本」 = mon livre ; 「日本語の先生」 = professeur de japonais.\n**も** (« aussi ») remplace は ou を : 「田中さんも学生です」 = M. Tanaka aussi est étudiant.",

 ["g08","Particules","を : le complément d'objet","N を V","**を** (lu **o**) marque le complément d'objet direct : ce sur quoi porte l'action.\nÀ la différence du français, le complément se place **avant** le verbe.",

 ["g09","Particules","に et へ : destination, moment, existence","lieu に／へ V ・ heure に V ・ lieu に あります／います","**に** marque : la destination, l'heure précise (七時に), le lieu d'existence (あります／います), la personne qui reçoit.\n**へ** (lu **e**) marque seulement la direction ; avec les verbes de déplacement il remplace souvent に.\nOn n'ajoute pas に après きょう, あした, まいにち, こんしゅう…",

 ["g10","Particules","で : lieu d'action et moyen","lieu で V ・ moyen で V","**で** marque le lieu où se déroule une action (学校で話します) et le moyen ou l'instrument (電車で行きます, 日本語で話します).\nPour dire qu'une chose **existe** quelque part, on emploie に (あります／います).",

 ["g11","Particules","と et や : et, avec","N1 と N2 ・ N1 や N2 ・ personne と V","**と** relie des noms (liste complète) ; **や** donne des exemples (liste non exhaustive, « entre autres »).\nAprès une personne, **と** signifie « avec » : 友だちと行きます.",

 ["g13","Particules","が avec すき, じょうず, わかる","N が すきです ・ N が じょうずです ・ N が わかります","Avec certains adjectifs et verbes, l'objet est marqué par **が** et non par を : **すき／きらい** (aimer / détester), **じょうず／へた** (doué / mauvais en), **わかる** (comprendre), **ほしい** (vouloir un objet).",

 ["g14","Verbes","Le verbe poli : ます, ません, ました, ませんでした","V-ます ・ V-ません ・ V-ました ・ V-ませんでした","La forme polie se termine par **ます**. Elle sert pour le présent habituel et le futur.\n• **ます** : 食べます (je mange, je mangerai)\n• **ません** : 食べません (je ne mange pas)\n• **ました** : 食べました (j'ai mangé)\n• **ませんでした** : 食べませんでした (je n'ai pas mangé)\nVerbes irréguliers : する → します ; 来る → きます.",

 ["g15","Verbes","あります et います : exister","lieu に N が あります／います ・ N は lieu に あります／います","**あります** : choses inanimées, plantes. **います** : personnes et animaux.\nPour situer : 「駅の前に店があります」 (devant la gare il y a un magasin). Mots de position : **うえ** (dessus), **した** (dessous), **なか** (dedans), **まえ** (devant), **うしろ** (derrière), **となり** (à côté).\nNégatif : ありません／いません.",
  [["{駅|えき}の {前|まえ}に {店|みせ}が あります。","Il y a un magasin devant la gare."],["{学校|がっこう}に {先生|せんせい}が います。","Il y a un professeur à l'école."],["{本|ほん}は {木|き}の {下|した}に あります。","Le livre est sous l'arbre."]],
  [["{山|やま}の {上|うえ}に {小|ちい}さい {店|みせ}が ＿＿。","Il y a un petit magasin en haut de la montagne.",["あります","います","ですか","ました"],"Un magasin est inanimé : あります."],["{学校|がっこう}の {前|まえ}に {男|おとこ}の {子|こ}が ＿＿。","Il y a un garçon devant l'école.",["います","あります","です","ません"],"Une personne est animée : います."]]],
 ["g16","Verbes","ませんか et ましょう : inviter, proposer","V-ませんか ・ V-ましょう","**V-ませんか** : proposition polie (« voulez-vous… ? »).\n**V-ましょう** : « faisons… ! », suggestion ou acceptation.\nOn ajoute souvent **いっしょに** (ensemble).",
  [["いっしょに {食|た}べませんか。","Voulez-vous manger avec moi ?"],["{駅|えき}で {会|あ}いましょう。","Retrouvons-nous à la gare."],["{日曜日|にちようび}に {山|やま}へ {行|い}きませんか。","Voulez-vous aller à la montagne dimanche ?"]],
  [["いっしょに {本|ほん}を {読|よ}み＿＿。","Lisons ensemble !",["ましょう","ました","ません","たいです"],"ましょう = « faisons »."],["いっしょに {行|い}き＿＿。","Voulez-vous venir avec moi ?",["ませんか","ました","ません","たいです"],"V-ませんか propose poliment."]]],
 ["g17","Verbes","La forme て","V-て : lier, demander, être en train de","La forme **て** est la base de nombreuses structures. Règles :\n• **Groupe 2** (verbes en る comme 食べる, 見る, 出る) : る → **て** (食べて, 見て)\n• **Groupe 1** : う・つ・る → **って** (買って, 待って, 帰って) ; む・ぶ・ぬ → **んで** (飲んで, 読んで, 遊んで) ; く → **いて** (書いて, 聞いて) ; ぐ → **いで** ; す → **して** (話して)\n• Exception : 行く → **行って**\n• Irréguliers : する → **して** ; 来る → **きて**\nElle sert à enchaîner des actions : 食べて、ねます (je mange puis je dors).",
  [["{食|た}べて、ねます。","Je mange puis je dors."],["{本|ほん}を {読|よ}んで、{書|か}きます。","Je lis un livre puis j'écris."],["{駅|えき}へ {行|い}って、{友|とも}だちに {会|あ}います。","Je vais à la gare puis je retrouve un ami."]],
  [["のむ → ＿＿","Forme て de のむ (boire).",["のんで","のいて","のって","のみて"],"む → んで."],["かく → ＿＿","Forme て de かく (écrire).",["かいて","かきて","かって","かんで"],"く → いて."],["たべる → ＿＿","Forme て de たべる (manger).",["たべて","たべって","たべんで","たべいて"],"Groupe 2 : る → て."],["かう → ＿＿","Forme て de かう (acheter).",["かって","かいて","かんで","かうて"],"う → って."],["はなす → ＿＿","Forme て de はなす (parler).",["はなして","はなって","はないて","はなんで"],"す → して."],["いく → ＿＿","Forme て de いく (aller), verbe exceptionnel.",["いって","いいて","いんで","いくて"],"いく est une exception : いって."],["くる → ＿＿","Forme て de くる (venir).",["きて","くって","くて","こて"],"くる → きて."]]],
 ["g18","Verbes","てください et をください : demander","V-て ください ・ N を ください","**V-て ください** : « veuillez… », demande polie. **N を ください** : « donnez-moi N » (au magasin, au restaurant).\nPour une demande plus douce, on ajoute **おねがいします**.",
  [["ここに {名前|なまえ}を {書|か}いて ください。","Écrivez votre nom ici, s'il vous plaît."],["もう {少|すこ}し {話|はな}して ください。","Parlez encore un peu, s'il vous plaît."],["{水|みず}を ください。","De l'eau, s'il vous plaît."]],
  [["ここに {名前|なまえ}を {書|か}＿＿ ください。","Écrivez votre nom ici, s'il vous plaît.",["いて","って","んで","して"],"かく → かいて."],["{水|みず}＿＿ ください。","De l'eau, s'il vous plaît.",["を","へ","まで","の"],"N を ください = donnez-moi N."]]],
 ["g19","Verbes","V-ています : en train de, état","V-て います","**V-ています** exprime :\n• une action en cours : 本を読んでいます (je suis en train de lire)\n• un état ou une situation durable : すんでいます (j'habite), しっています (je sais)\nNégatif : V-て いません. Dans la conversation, le い est souvent supprimé.",
  [["{今|いま} {本|ほん}を {読|よ}んで います。","Je suis en train de lire un livre."],["{父|ちち}は {店|みせ}で {話|はな}して います。","Mon père est en train de parler au magasin."],["リヨンに すんで います。","J'habite à Lyon."]],
  [["{友|とも}だちは {今|いま} {水|みず}を {飲|の}んで ＿＿。","Mon ami est en train de boire de l'eau.",["います","あります","です","ました"],"V-て います : action en cours."],["{今|いま} {何|なに}を して ＿＿か。","Que faites-vous en ce moment ?",["います","です","ません","ましょう"],"して います = « être en train de faire »."]]],
 ["g20","Verbes","V-たい et ほしい : vouloir","V (racine) + たいです ・ N が ほしいです","**V-たいです** : « je veux V ». On prend la racine du ます (行きます → 行き) + たい. Il se conjugue comme un adjectif en い : 行きたくないです (je ne veux pas aller), 行きたかったです (je voulais aller).\n**N が ほしいです** : « je veux (avoir) N ».",
  [["{日本|にほん}へ {行|い}きたいです。","Je veux aller au Japon."],["{水|みず}が {飲|の}みたいです。","Je veux boire de l'eau."],["{新|あたら}しい {車|くるま}が ほしいです。","Je veux une voiture neuve."]],
  [["{日本語|にほんご}を {話|はな}し＿＿です。","Je veux parler japonais.",["たい","たく","ない","ます"],"V-たいです = « vouloir »."],["{新|あたら}しい {車|くるま}が ＿＿です。","Je veux une voiture neuve.",["ほしい","たい","します","きれい"],"Pour désirer un objet : ほしい."]]],
 ["g21","Verbes","Forme du dictionnaire, ない et た","V-る ・ V-ない ・ V-た","Entre amis, on utilise les formes simples :\n• **dictionnaire** (présent affirmatif) : 食べる, 飲む, 行く, する, 来る\n• **ない** (négatif) : groupe 1 → dernière syllabe en **あ** + ない (飲む → 飲まない, 買う → 買わない) ; groupe 2 : る → ない (食べない) ; する → しない ; 来る → こない\n• **た** (passé) : comme la forme て (て → た, で → だ) : 食べた, 飲んだ, 行った.\nOn les voit dans les chansons, les journaux et entre amis.",
  [["{毎日|まいにち} {水|みず}を {飲|の}む。","Je bois de l'eau chaque jour."],["{今日|きょう}は {学校|がっこう}へ {行|い}かない。","Aujourd'hui, je ne vais pas à l'école."],["きのう {本|ほん}を {読|よ}んだ。","Hier, j'ai lu un livre."]],
  [["のむ → （négatif）＿＿","Forme ない de のむ.",["のまない","のみない","のめない","のんない"],"Groupe 1 : む → ま + ない."],["たべる → （passé）＿＿","Forme た de たべる.",["たべた","たべって","たべだ","たべんだ"],"Groupe 2 : る → た."],["いく → （passé）＿＿","Forme た de いく.",["いった","いいた","いんだ","いくた"],"いく est exceptionnel : いった."]]],
 ["g22","Verbes","ないでください, てもいいですか, てはいけません","V-ない + で ください ・ V-て + も いいです ・ V-て + は いけません","• **V-ないで ください** : « ne … pas, s'il vous plaît »\n• **V-て も いいですか** : « puis-je… ? » (permission) ; réponse : いいです／だめです\n• **V-て は いけません** : « il est interdit de… »",
  [["ここで {話|はな}さないで ください。","Ne parlez pas ici, s'il vous plaît."],["ここに {入|はい}っても いいですか。","Puis-je entrer ici ?"],["ここで {食|た}べては いけません。","Il est interdit de manger ici."]],
  [["ここで {電話|でんわ}を して ＿＿ですか。","Puis-je téléphoner ici ?",["もいい","はいけません","ください","たい"],"V-て もいいですか demande la permission."],["{中|なか}に {入|はい}って ＿＿。","Il est interdit d'entrer.",["はいけません","もいいです","ください","たいです"],"V-て はいけません exprime l'interdiction."]]],
 ["g23","Verbes","あげます et もらいます : donner, recevoir","personne に N を あげます／もらいます","**あげます** : donner (à quelqu'un d'autre). **もらいます** : recevoir. La personne concernée est marquée par **に** (ou **から** pour « de la part de »).",
  [["{母|はは}に {花|はな}を あげました。","J'ai donné des fleurs à ma mère."],["{友|とも}だちに {本|ほん}を もらいました。","J'ai reçu un livre d'un ami."],["{父|ちち}に {電話|でんわ}を しました。","J'ai téléphoné à mon père."]],
  [["{母|はは}＿＿ {花|はな}を あげました。","J'ai donné des fleurs à ma mère.",["に","を","で","まで"],"Le destinataire est marqué par に."],["{友|とも}だち＿＿ {本|ほん}を もらいました。","J'ai reçu un livre d'un ami.",["に","を","で","へ"],"Avec もらう, la personne qui donne est marquée par に (ou から)."]]],
 ["g24","Adjectifs","Les adjectifs en い","高い → 高いです ・ 高くないです ・ 高かったです ・ 高くなかったです","Ils se terminent par **い**. Devant un nom : 高い車. À la fin : 高いです.\n• négatif : い → **くない** (高くないです)\n• passé : い → **かった** (高かったです)\n• passé négatif : い → **くなかった** (高くなかったです)\nException : **いい** (bon) devient **よくない**, **よかった**.",
  [["この {本|ほん}は {高|たか}いです。","Ce livre est cher."],["この {本|ほん}は {高|たか}くないです。","Ce livre n'est pas cher."],["きのうは {天気|てんき}が よかったです。","Hier, il faisait beau."],["{新|あたら}しい {車|くるま}です。","C'est une voiture neuve."]],
  [["この {車|くるま}は {高|たか}＿＿。","Cette voiture n'est pas chère.",["くないです","いないです","じゃありません","くです"],"Négatif d'un adjectif en い : い → くない."],["きのうは {天気|てんき}が よ＿＿。","Hier, il faisait beau.",["かったです","いでした","かったでした","くないです"],"Passé : い → かった + です."]]],
 ["g25","Adjectifs","Les adjectifs en な","きれい → きれいです ・ きれいじゃありません ・ きれいでした ・ きれいな + nom","Devant un nom, on ajoute **な** : きれいな花.\n• présent : きれいです\n• négatif : きれいじゃありません\n• passé : きれいでした\n• passé négatif : きれいじゃありませんでした\nAttention : **きれい** et **きらい** finissent par い mais sont des adjectifs en な.",
  [["この {花|はな}は きれいです。","Cette fleur est jolie."],["きれいな {花|はな}です。","C'est une jolie fleur."],["{山|やま}は しずかでした。","La montagne était calme."],["この {店|みせ}は にぎやかじゃありません。","Ce magasin n'est pas animé."]],
  [["しずか＿＿ {店|みせ}です。","C'est un magasin calme.",["な","の","い","に"],"Un adjectif en な se place devant le nom avec な."],["きのうの {山|やま}は きれい＿＿。","La montagne d'hier était belle.",["でした","かったです","くないです","ました"],"Passé d'un adjectif en な : でした."]]],
 ["g26","Adjectifs","Comparer : より et いちばん","A は B より … ・ A と B と、どちらが … ・ いちばん","• **A は B より 〜** : A est plus 〜 que B\n• **A と B と、どちらが 〜ですか** : lequel est plus 〜 ? (réponse : A のほうが 〜です)\n• **いちばん 〜** : le plus 〜",
  [["{電車|でんしゃ}は {車|くるま}より {安|やす}いです。","Le train est moins cher que la voiture."],["{車|くるま}と {電車|でんしゃ}と、どちらが {高|たか}いですか。","Entre la voiture et le train, lequel est plus cher ?"],["{日本語|にほんご}が いちばん おもしろいです。","Le japonais est ce qui est le plus intéressant."]],
  [["{電車|でんしゃ}は {車|くるま}＿＿ {安|やす}いです。","Le train est moins cher que la voiture.",["より","から","まで","と"],"より introduit le terme de comparaison."],["{山|やま}と {川|かわ}と、＿＿が {大|おお}きいですか。","Entre la montagne et la rivière, lequel est plus grand ?",["どちら","どこ","だれ","いつ"],"どちら = lequel (parmi deux)."]]],
 ["g27","Expressions","から et が : cause et contraste","Phrase 1 から、Phrase 2 ・ Phrase 1 が、Phrase 2","**から** indique la cause : la raison vient **avant** la conséquence (« Comme P1, P2 »). **が** en milieu de phrase = « mais ».\n雨ですから、行きません (comme il pleut, je n'y vais pas). 高いですが、おいしいです (c'est cher, mais c'est délicieux).",
  [["{雨|あめ}ですから、{外|そと}に {出|で}ません。","Comme il pleut, je ne sors pas."],["{安|やす}いですから、{買|か}います。","Comme c'est bon marché, j'achète."],["この {本|ほん}は {古|ふる}いですが、おもしろいです。","Ce livre est vieux, mais il est intéressant."]],
  [["{高|たか}いです＿＿、{買|か}いません。","Comme c'est cher, je n'achète pas.",["から","まで","を","の"],"から exprime la cause."],["この {本|ほん}は {古|ふる}いです＿＿、おもしろいです。","Ce livre est vieux, mais il est intéressant.",["が","から","まで","を"],"が exprime le contraste (« mais »)."]]],
 ["g28","Expressions","Les adverbes de degré et de fréquence","もう ・ まだ ・ あまり ・ ぜんぜん ・ よく ・ ときどき ・ いつも","• **もう** + passé : déjà ; **まだ** + négatif : pas encore\n• **あまり** + négatif : pas très ; **ぜんぜん** + négatif : pas du tout\n• **とても** : très ; **すこし** : un peu ; **たくさん** : beaucoup\n• **いつも** (toujours) > **よく** (souvent) > **ときどき** (parfois)",
  [["もう {食|た}べました。","J'ai déjà mangé."],["まだ {食|た}べて いません。","Je n'ai pas encore mangé."],["あまり {高|たか}くないです。","Ce n'est pas très cher."],["ぜんぜん {分|わ}かりません。","Je ne comprends pas du tout."]],
  [["＿＿ {食|た}べました。","J'ai déjà mangé.",["もう","まだ","ぜんぜん","あまり"],"もう + passé = déjà."],["{日本語|にほんご}が ＿＿ {分|わ}かりません。","Je ne comprends pas du tout le japonais.",["ぜんぜん","とても","たくさん","いちばん"],"ぜんぜん s'emploie avec un verbe négatif."]]],
 ["g29","Expressions","L'heure et la durée","〜時 ・ 〜分 ・ 半 ・ 〜時間","• Heures : **〜時** (じ) : 三時 = 3 h ; **半** (はん) = et demie : 三時半 ; **午前／午後** = a.m. / p.m.\n• Minutes : **〜分** (ふん／ぷん) : 五分, 十分 (じゅっぷん)\n• Durée : **〜時間** (じかん) : 一時間 = une heure\n• On ajoute に pour une heure précise : 七時に行きます.",
  [["{七時|しちじ}に {学校|がっこう}へ {行|い}きます。","Je vais à l'école à 7 h."],["{三時|さんじ}{半|はん}に {会|あ}います。","On se retrouve à 3 h 30."],["{一時間|いちじかん} {本|ほん}を {読|よ}みます。","Je lis pendant une heure."]],
  [["{今|いま}は {二時|にじ}＿＿です。","Il est 2 h 30.",["半","分","時間","前"],"半 (はん) = et demie."],["{一|いち}＿＿ {本|ほん}を {読|よ}みます。","Je lis pendant une heure.",["時間","時","分","日"],"一時間 = une heure de durée."]]]
];

var GROUPS=[
 {id:"base",label:"Base",short:"Base",cols:5,rows:BASE},
 {id:"dakuten",label:"Dakuten et handakuten",short:"Dakuten",cols:5,rows:DAK},
 {id:"yoon",label:"Sons combinés",short:"Sons combinés",cols:3,rows:YOON}
];
var SCRIPTS=[
 {id:"hira",label:"Hiragana",conv:function(s){return s;},intro:"Le syllabaire de base : mots japonais, grammaire, terminaisons."},
 {id:"kata",label:"Katakana",conv:toKata,intro:"Pour les mots d'origine étrangère, les noms propres et l'insistance."}
];
var SETS=[],SETMAP={};
SCRIPTS.forEach(function(sc){GROUPS.forEach(function(g){
  var entries=[];
  g.rows.forEach(function(r){r.forEach(function(cell){var p=split(cell);if(p)entries.push({set:sc.id+"-"+g.id,script:sc.id,ch:sc.conv(p.ch),ans:p.ro});});});
  var s={id:sc.id+"-"+g.id,script:sc.id,short:g.short,entries:entries};
  SETS.push(s);SETMAP[s.id]=s;
});});
var kset={id:"kanji",script:"kanji",short:"N5",entries:KANJI.map(function(k){return {set:"kanji",script:"kanji",ch:k[0],on:k[1],kun:k[2],ans:k[3]};})};
SETS.push(kset);SETMAP.kanji=kset;
var ALL=[];SETS.forEach(function(s){ALL=ALL.concat(s.entries);});
var SCRIPT_LABEL={hira:"Hiragana",kata:"Katakana",kanji:"Kanji"};
$("#sub").textContent="Hiragana · Katakana · "+KANJI.length+" kanji";

/* ---------- État ---------- */
var state={tab:"learn",learn:"hira",sets:["hira-base"],q:""};
try{
  var saved=JSON.parse(localStorage.getItem("kk-n5")||"null");
  if(saved){
    if(["learn","cards","test","vocab","gram","prog","read"].indexOf(saved.tab)>-1)state.tab=saved.tab;
    if(Array.isArray(saved.sets)){var ok=saved.sets.filter(function(id){return SETMAP[id];});if(ok.length)state.sets=ok;}
  }
}catch(e){}
function save(){try{localStorage.setItem("kk-n5",JSON.stringify({tab:state.tab,sets:state.sets}));}catch(e){}}
function deckOf(){var out=[];SETS.forEach(function(s){if(state.sets.indexOf(s.id)>-1)out=out.concat(s.entries);});return out;}

/* ---------- Apprendre ---------- */
function kanaHTML(scId){
  var sc=SCRIPTS.filter(function(x){return x.id===scId;})[0];
  var groups=GROUPS.map(function(g){
    var n=SETMAP[scId+"-"+g.id].entries.length;
    var cells=[];
    g.rows.forEach(function(r){r.forEach(function(cell){
      var p=split(cell);
      cells.push(p?'<div class="kc"><span class="ch jp" lang="ja">'+esc(sc.conv(p.ch))+'</span><span class="ro">'+esc(p.ro)+'</span></div>':'<div class="kc empty" aria-hidden="true"></div>');
    });});
    return '<section class="group"><h3>'+esc(g.label)+' <small>'+n+'</small></h3><div class="kgrid" style="--cols:'+g.cols+'">'+cells.join("")+'</div></section>';
  }).join("");
  return '<p class="intro">'+esc(sc.intro)+'</p><div class="groups">'+groups+'</div>';
}
function kanjiShell(){
  return '<p class="intro">'+KANJI.length+' kanji du niveau N5. « On » est la lecture d\'origine chinoise, « Kun » la lecture japonaise ; les parenthèses marquent les okurigana.</p>'+
    '<div class="searchrow"><label for="kq" style="position:absolute;left:-9999px">Chercher</label>'+
    '<input id="kq" type="search" placeholder="Chercher un kanji, une lecture ou un sens" autocomplete="off" value="'+esc(state.q)+'"><span id="kcount"></span></div>'+
    '<div class="kgrid2" id="kgrid"></div>';
}
function fillKanji(){
  var q=norm(state.q.trim());
  var list=kset.entries.filter(function(k){
    if(!q)return true;
    return k.ch.indexOf(q)>-1||norm(k.on).indexOf(q)>-1||norm(k.kun).indexOf(q)>-1||norm(k.ans).indexOf(q)>-1;
  });
  $("#kcount").textContent=list.length+" / "+kset.entries.length;
  $("#kgrid").innerHTML=list.length?list.map(function(k){
    return '<article class="kt"><div class="kch jp" lang="ja">'+esc(k.ch)+'</div><div class="kbody"><div class="kfr">'+esc(k.ans)+'</div>'+
      '<div class="kr"><b>On</b> '+(k.on?'<span lang="ja">'+esc(k.on)+'</span>':'<span class="none">–</span>')+'</div>'+
      '<div class="kr"><b>Kun</b> '+(k.kun?'<span lang="ja">'+esc(k.kun)+'</span>':'<span class="none">–</span>')+'</div></div></article>';
  }).join(""):'<p class="empty-msg" style="grid-column:1/-1">Aucun kanji ne correspond à cette recherche.</p>';
}
function renderLearn(){

/* ---------- Sélecteur de contenu ---------- */
function chip(s){return '<button type="button" class="chip" data-a="toggle" data-set="'+s.id+'" aria-pressed="'+(state.sets.indexOf(s.id)>-1)+'">'+esc(s.short)+' <small>'+s.entries.length+'</small></button>';}
function pickerHTML(){
  var rows=SCRIPTS.map(function(sc){
    return '<div class="prow"><span class="plabel">'+sc.label+'</span>'+SETS.filter(function(s){return s.script===sc.id;}).map(chip).join("")+'</div>';
  }).join("")+'<div class="prow"><span class="plabel">Kanji</span>'+chip(kset)+'</div>';

function seg(label,action,cur,items){

function toggleSet(id){
  var i=state.sets.indexOf(id);

/* ---------- Flashcards ---------- */
var cs={phase:"idle",deck:[],i:0,flipped:false,missed:[],known:0,dir:"char",shuffle:true};
function cardsReset(deck){
  var d=deckOf();
  cs.deck=deck||(cs.shuffle?shuffle(d):d);
  cs.i=0;cs.flipped=false;cs.missed=[];cs.known=0;
  cs.phase=cs.deck.length?"run":"idle";
}
function renderCardsTop(){
  $("#cards-top").innerHTML=pickerHTML()+'<div class="opts">'+
    seg("Face visible","cdir",cs.dir,[["char","Caractère d'abord"],["ans","Réponse d'abord"]])+
    '<label class="check"><input type="checkbox" id="c-shuffle"'+(cs.shuffle?" checked":"")+'> Mélanger</label></div>';
}
function glyph(e){return '<span class="glyph jp" lang="ja">'+esc(e.ch)+'</span>';}
function readsHTML(e){
  if(e.script!=="kanji")return "";
  return '<span class="reads"><b>On</b><span lang="ja">'+(e.on?esc(e.on):"–")+'</span><br><b>Kun</b><span lang="ja">'+(e.kun?esc(e.kun):"–")+'</span></span>';
}
function ansFace(e,full){
  if(e.script!=="kanji")return '<span class="ans-big">'+esc(e.ans)+'</span>';
  return '<span class="ans-fr">'+esc(e.ans)+'</span>'+(full?readsHTML(e):"");
}
function renderCardsStage(focus,anim){
  var el=$("#cards-stage");
  if(!cs.deck.length){el.innerHTML='<p class="empty-msg">Choisis au moins un jeu de caractères pour lancer les flashcards.</p>';return;}
  var total=cs.deck.length;
  if(cs.phase==="done"){
    var miss=cs.missed.map(function(e){return '<span class="mc"><span class="jp" lang="ja">'+esc(e.ch)+'</span><small>'+esc(e.ans)+'</small></span>';}).join("");
    el.innerHTML='<div class="stage"><div class="result"><div class="score"><span class="big">'+cs.known+'</span><span>sur '+total+' connues</span></div>'+
      (cs.missed.length?'<h3>À revoir</h3><div class="miss">'+miss+'</div>':'<p>Toutes les cartes sont connues.</p>')+
      '<div class="actions">'+(cs.missed.length?'<button type="button" class="btn primary" data-a="credo">Revoir les '+cs.missed.length+' ratées</button>':'')+
      '<button type="button" class="btn" data-a="crestart">Recommencer</button></div></div></div>';
    return;
  }
  var e=cs.deck[cs.i];
  var front,back;
  if(cs.dir==="char"){front=glyph(e);back=ansFace(e,true);}
  else{front=ansFace(e,false);back=glyph(e)+readsHTML(e);}
  var showsChar=(cs.dir==="char")!==cs.flipped;
  el.innerHTML='<div class="stage">'+
    '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="'+total+'" aria-valuenow="'+cs.i+'"><span style="width:'+(cs.i/total*100)+'%"></span></div>'+
    '<div class="prog-l"><span>Carte '+(cs.i+1)+' sur '+total+'</span><span>'+cs.known+' connues</span></div>'+
    '<button type="button" class="card'+(showsChar?" guide":"")+(anim?" anim":"")+'" data-a="flip" aria-label="Retourner la carte">'+
      '<span class="tag">'+SCRIPT_LABEL[e.script]+'</span>'+(cs.flipped?back:front)+'<span class="hint">'+(cs.flipped?"Touche ← à revoir · → je sais":"Toucher pour retourner")+'</span></button>'+
    '<div class="actions">'+(cs.flipped?
      '<button type="button" class="btn bad" data-a="miss">À revoir</button><button type="button" class="btn good" data-a="know">Je sais</button>':
      '<button type="button" class="btn primary" data-a="flip">Retourner</button>')+'</div></div>';
  if(focus&&state.tab==="cards"){var c=$("#cards-stage .card");if(c)c.focus({preventScroll:true});}
}
function mark(known){
  if(cs.phase!=="run"||!cs.flipped)return;
  var e=cs.deck[cs.i];
  if(known)cs.known++;else cs.missed.push(e);
  cs.i++;cs.flipped=false;
  if(cs.i>=cs.deck.length)cs.phase="done";
  renderCardsStage(true,true);
}

/* ---------- Test ---------- */
var ts={phase:"setup",count:10,dir:"char",qs:[],i:0,picked:null,score:0,wrong:[]};
function distract(e,deck){
  var seen={};seen[e.ans]=1;var out=[];
  [deck,ALL].forEach(function(pool){
    if(out.length>=3)return;
    shuffle(pool.filter(function(x){return x.script===e.script;})).forEach(function(x){
      if(out.length<3&&!seen[x.ans]){seen[x.ans]=1;out.push(x);}
    });
  });
  return out;
}
function tStart(entries){
  var deck=deckOf();
  if(!deck.length)return;
  var list=entries||shuffle(deck).slice(0,ts.count===0?deck.length:Math.min(ts.count,deck.length));
  ts.qs=list.map(function(e){return {e:e,options:shuffle([e].concat(distract(e,deck)))};});
  ts.i=0;ts.picked=null;ts.score=0;ts.wrong=[];ts.redo=!!entries;ts.phase="run";
}
function renderTestTop(){
  $("#test-top").innerHTML=ts.phase==="run"?"":pickerHTML();
}
function renderTestStage(focus){
  var el=$("#test-stage");
  if(ts.phase==="setup"){
    var deck=deckOf();
    if(!deck.length){el.innerHTML='<p class="empty-msg">Choisis au moins un jeu de caractères pour créer un test.</p>';renderTestTop();return;}
    el.innerHTML='<div class="stage"><div class="opt-block"><span class="lab">Nombre de questions</span>'+
      seg("Nombre de questions","tcount",ts.count,[[10,"10"],[20,"20"],[0,"Tout ("+deck.length+")"]])+'</div>'+
      '<div class="opt-block"><span class="lab">Sens des questions</span>'+
      seg("Sens des questions","tdir",ts.dir,[["char","Caractère → réponse"],["ans","Réponse → caractère"]])+'</div>'+
      '<div class="actions"><button type="button" class="btn primary" data-a="tstart">Commencer le test</button></div></div>';
    renderTestTop();return;
  }
  if(ts.phase==="done"){
    var n=ts.qs.length,pct=Math.round(ts.score/n*100),best=null;
    try{best=parseInt(localStorage.getItem("kk-best"),10);if(isNaN(best))best=null;if(best===null||pct>best){localStorage.setItem("kk-best",String(pct));}}catch(e){}
    var msg=pct>=90?"Très solide.":pct>=70?"Bien, quelques erreurs à revoir.":"À retravailler avec les flashcards.";
    var miss=ts.wrong.map(function(e){return '<span class="mc"><span class="jp" lang="ja">'+esc(e.ch)+'</span><small>'+esc(e.ans)+'</small></span>';}).join("");
    el.innerHTML='<div class="stage"><div class="result"><div class="score"><span class="big">'+ts.score+'</span><span>sur '+n+' ('+pct+' %)</span></div><p>'+msg+(best!==null&&best>pct?' Meilleur score : '+best+' %.':'')+'</p>'+
      (ts.wrong.length?'<h3>Erreurs</h3><div class="miss">'+miss+'</div>':'')+
      '<div class="actions">'+(ts.wrong.length?'<button type="button" class="btn primary" data-a="tredo">Refaire mes erreurs</button>':'')+
      '<button type="button" class="btn" data-a="tnew">Nouveau test</button></div></div></div>';
    renderTestTop();return;
  }
  var q=ts.qs[ts.i],total=ts.qs.length,answered=ts.picked!==null,correct=q.options.indexOf(q.e);
  var label=ts.dir==="ans"?"Quel est ce caractère ?":(q.e.script==="kanji"?"Quel est le sens de ce kanji ?":"Quelle est la lecture de ce caractère ?");
  var prompt=ts.dir==="char"?
    '<div class="prompt guide"><span class="tag">'+SCRIPT_LABEL[q.e.script]+'</span>'+glyph(q.e)+'</div>':
    '<div class="prompt"><span class="tag">'+SCRIPT_LABEL[q.e.script]+'</span>'+ansFace(q.e,false)+'</div>';
  var choices=q.options.map(function(o,idx){
    var cls=answered?(idx===correct?" ok":(idx===ts.picked?" ko":" dim")):"";
    var t=ts.dir==="char"?'<span class="t">'+esc(o.ans)+'</span>':'<span class="t jp" lang="ja">'+esc(o.ch)+'</span>';
    return '<button type="button" class="choice'+cls+'" data-a="tpick" data-k="'+idx+'"><span class="n">'+(idx+1)+'</span>'+t+'</button>';
  }).join("");
  var fb="";
  if(answered){
    var good=ts.picked===correct;
    fb='<p class="fb '+(good?"ok":"ko")+'" role="status">'+(good?"Correct.":"Raté. Bonne réponse : "+(ts.dir==="char"?esc(q.e.ans):'<span class="jp" lang="ja">'+esc(q.e.ch)+'</span>'))+'</p>'+
      '<div class="actions"><button type="button" class="btn primary" data-a="tnext">'+(ts.i===total-1?"Voir le résultat":"Question suivante")+'</button></div>';
  }
  el.innerHTML='<div class="stage"><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="'+total+'" aria-valuenow="'+ts.i+'"><span style="width:'+(ts.i/total*100)+'%"></span></div>'+
    '<div class="prog-l"><span>Question '+(ts.i+1)+' sur '+total+'</span><span>Score '+ts.score+'</span></div>'+
    '<p class="qlabel">'+label+'</p>'+prompt+'<div class="choices">'+choices+'</div>'+fb+'</div>';
  renderTestTop();
  if(focus&&answered&&state.tab==="test"){var b=$("#test-stage [data-a='tnext']");if(b)b.focus({preventScroll:true});}
}
function tPick(k){
  if(ts.phase!=="run"||ts.picked!==null)return;
  var q=ts.qs[ts.i];
  ts.picked=k;
  if(q.options[k]===q.e)ts.score++;else ts.wrong.push(q.e);
  renderTestStage(true);
}
function tNext(){
  if(ts.picked===null)return;
  ts.i++;ts.picked=null;
  if(ts.i>=ts.qs.length){ts.phase="done";if(!ts.redo)pRecordKana();}
  renderTestStage();
}

var rs={phase:"setup",filter:"all",count:10,qs:[],i:0,picked:null,score:0,wrong:[],furi:false,helped:0,counted:false};
var NFURI=TEXTS.filter(function(t){return t.furi;}).length;
$("#sub").textContent="Hiragana · Katakana · "+KANJI.length+" kanji · "+TEXTS.length+" textes";
function rubyOf(s){return esc(s).replace(/\{([^|}]+)\|([^}]+)\}/g,"<ruby>$1<rt>$2</rt></ruby>");}
function rPool(){return TEXTS.filter(function(t){return rs.filter==="all"||(rs.filter==="yes"?t.furi:!t.furi);});}
function rStart(list){
  var pool=list||shuffle(rPool());
  if(!list)pool=pool.slice(0,rs.count===0?pool.length:Math.min(rs.count,pool.length));
  if(!pool.length)return;
  rs.qs=pool.map(function(t){return {t:t,options:shuffle(t.opts.map(function(l,k){return {label:l,ok:k===0};}))};});
  rs.i=0;rs.picked=null;rs.score=0;rs.wrong=[];rs.helped=0;rs.counted=false;rs.redo=!!list;rs.furi=rs.qs[0].t.furi;rs.phase="run";
}
function renderReadStage(focus){
  var el=$("#read-stage");
  if(rs.phase==="setup"){
    var n=rPool().length;
    el.innerHTML='<div class="stage wide"><p class="intro">'+TEXTS.length+' petits textes de niveau N5, chacun suivi d\'une question de compréhension. Les textes « avec furigana » montrent la lecture des kanji. Dans les autres, tu peux les afficher en cas de blocage, et le résultat le notera.</p>'+
      '<div class="opt-block"><span class="lab">Textes</span>'+
      seg("Textes","rfilter",rs.filter,[["all","Tous ("+TEXTS.length+")"],["yes","Avec furigana ("+NFURI+")"],["no","Sans furigana ("+(TEXTS.length-NFURI)+")"]])+'</div>'+
      '<div class="opt-block"><span class="lab">Nombre de textes</span>'+
      seg("Nombre de textes","rcount",rs.count,[[10,"10"],[20,"20"],[50,"50"],[0,"Tout ("+n+")"]])+'</div>'+
      '<div class="actions"><button type="button" class="btn primary" data-a="rstart">Commencer</button></div></div>';
    return;
  }
  if(rs.phase==="done"){
    var n2=rs.qs.length,pct=Math.round(rs.score/n2*100);
    var msg=pct>=90?"Très bonne lecture.":pct>=70?"Bien, quelques textes à relire.":"À retravailler : relis les kanji dans l'onglet Apprendre.";
    var miss=rs.wrong.map(function(t){return '<div class="mt"><div class="txt jp" lang="ja">'+rubyOf(t.jp)+'</div><small>'+esc(t.fr).replace(/\n/g,"<br>")+'</small></div>';}).join("");
    el.innerHTML='<div class="stage wide"><div class="result"><div class="score"><span class="big">'+rs.score+'</span><span>sur '+n2+' ('+pct+' %)</span></div><p>'+msg+'</p>'+
      (rs.helped?'<p class="reads">Furigana affichés avant de répondre : '+rs.helped+'.</p>':'')+
      (rs.wrong.length?'<h3>À relire</h3><div class="mlist">'+miss+'</div>':'')+
      '<div class="actions">'+(rs.wrong.length?'<button type="button" class="btn primary" data-a="rredo">Refaire mes erreurs</button>':'')+
      '<button type="button" class="btn" data-a="rnew">Nouvelle série</button></div></div></div>';
    return;
  }
  var q=rs.qs[rs.i],total=rs.qs.length,answered=rs.picked!==null,correct=0;
  q.options.forEach(function(o,k){if(o.ok)correct=k;});
  var choices=q.options.map(function(o,idx){
    var cls=answered?(idx===correct?" ok":(idx===rs.picked?" ko":" dim")):"";
    return '<button type="button" class="choice'+cls+'" data-a="rpick" data-k="'+idx+'"><span class="n">'+(idx+1)+'</span><span class="t">'+esc(o.label)+'</span></button>';
  }).join("");
  var fb="";
  if(answered){
    var good=rs.picked===correct;
    fb='<p class="fb '+(good?"ok":"ko")+'" role="status">'+(good?"Correct.":"Raté. Bonne réponse : "+esc(q.options[correct].label))+'</p>'+
      '<div class="tr"><b>Traduction</b>'+esc(q.t.fr).replace(/\n/g,"<br>")+'</div>'+
      '<div class="actions"><button type="button" class="btn primary" data-a="rnext">'+(rs.i===total-1?"Voir le résultat":"Texte suivant")+'</button></div>';
  }
  el.innerHTML='<div class="stage wide">'+
    '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="'+total+'" aria-valuenow="'+rs.i+'"><span style="width:'+(rs.i/total*100)+'%"></span></div>'+
    '<div class="prog-l"><span>Texte '+(rs.i+1)+' sur '+total+'</span><span>Score '+rs.score+'</span></div>'+
    '<div class="rtools"><button type="button" class="chip" data-a="rfuri" aria-pressed="'+rs.furi+'"><span class="fk" aria-hidden="true">ふ</span>Furigana</button></div>'+
    '<div class="paper"><span class="tag">'+(q.t.furi?"Avec furigana":"Sans furigana")+'</span><div class="txt jp'+(rs.furi?"":" nofuri")+'" lang="ja">'+rubyOf(q.t.jp)+'</div></div>'+
    '<p class="qlabel">'+esc(q.t.q)+'</p><div class="choices rd">'+choices+'</div>'+fb+'</div>';
  if(focus&&answered&&state.tab==="read"){var b=$("#read-stage [data-a='rnext']");if(b)b.focus({preventScroll:true});}
}
function rPick(k){
  if(rs.phase!=="run"||rs.picked!==null)return;
  var q=rs.qs[rs.i];
  rs.picked=k;rs.furi=true;
  if(q.options[k].ok)rs.score++;else rs.wrong.push(q.t);
  renderReadStage(true);
}
function rNext(){
  if(rs.picked===null)return;
  rs.i++;rs.picked=null;rs.counted=false;
  if(rs.i>=rs.qs.length){rs.phase="done";if(!rs.redo)pRecord("read",rs.score,rs.qs.length);}else rs.furi=rs.qs[rs.i].t.furi;
  renderReadStage();
}
function rFuri(){
  if(rs.phase!=="run")return;
  var q=rs.qs[rs.i];
  rs.furi=!rs.furi;
  if(rs.furi&&!q.t.furi&&rs.picked===null&&!rs.counted){rs.helped++;rs.counted=true;}
  renderReadStage();
}

});

function vmark(known){
  if(vs.cphase!=="run"||!vs.cflip)return;

function vtPool(){var d=vwords();return vs.tdir==="lec"?d.filter(function(w){return w.kan;}):d;}
function vtLabel(w){return vs.tdir==="jf"?w.fr:(vs.tdir==="fj"?w.jp:w.rd);}
function vtDistract(w,pool){
  var seen={};seen[vtLabel(w)]=1;var out=[];
  var base=vs.tdir==="lec"?WORDS.filter(function(x){return x.kan;}):WORDS;
  var same=base.filter(function(x){return x.th===w.th;});
  [same,pool,base].forEach(function(src){
    if(out.length>=3)return;
    shuffle(src).forEach(function(x){var l=vtLabel(x);if(out.length<3&&!seen[l]){seen[l]=1;out.push(x);}});
  });
  return out;
}
function vtStart(list){
  var pool=vtPool();
  var items=list||shuffle(pool).slice(0,vs.tcount===0?pool.length:Math.min(vs.tcount,pool.length));
  if(!items.length)return;
  vs.tqs=items.map(function(w){return {w:w,options:shuffle([w].concat(vtDistract(w,pool)))};});
  vs.ti=0;vs.tpick=null;vs.tscore=0;vs.twrong=[];vs.tredo=!!list;vs.tphase="run";
}

      seg("Type de question","vtdir",vs.tdir,[["jf","Japonais → français"],["fj","Français → japonais"],["lec","Lecture des kanji"]])+'</div>'+
      '<div class="opt-block"><span class="lab">Nombre de questions</span>'+
      seg("Nombre de questions","vtcount",vs.tcount,[[10,"10"],[20,"20"],[50,"50"],[0,"Tout ("+pool.length+")"]])+'</div>'+
      (pool.length?'<div class="actions"><button type="button" class="btn primary" data-a="vtstart">Commencer le test</button></div>':
        '<p class="empty-msg">Aucun mot avec kanji dans ces thèmes. Choisis d\'autres thèmes ou un autre type de question.</p>')+'</div>';

    var miss=vs.twrong.map(function(w){return '<div class="mt"><div class="jp" lang="ja" style="font-size:22px">'+esc(w.jp)+(w.kan?' <small style="font-size:14px">('+esc(w.rd)+')</small>':'')+'</div><small>'+esc(w.fr)+'</small></div>';}).join("");

      '<div class="actions">'+(vs.twrong.length?'<button type="button" class="btn primary" data-a="vtredo">Refaire mes erreurs</button>':'')+
      '<button type="button" class="btn" data-a="vtnew">Nouveau test</button></div></div></div>';
    return;
  }
  var q=vs.tqs[vs.ti],total=vs.tqs.length,answered=vs.tpick!==null,correct=0;

  var label=vs.tdir==="jf"?"Que veut dire ce mot ?":(vs.tdir==="fj"?"Comment dit-on cela en japonais ?":"Quelle est la lecture de ce mot ?");
  var tag='<span class="tag">'+esc(THEMES[q.w.th].name)+'</span>';

  var choices=q.options.map(function(o,idx){
    var cls=answered?(idx===correct?" ok":(idx===vs.tpick?" ko":" dim")):"";
    var l=vtLabel(o);

    return '<button type="button" class="choice'+cls+'" data-a="vtpick" data-k="'+idx+'"><span class="n">'+(idx+1)+'</span>'+t+'</button>';
  }).join("");
  var fb="";

    var good=vs.tpick===correct;
    fb='<p class="fb '+(good?"ok":"ko")+'" role="status">'+(good?"Correct.":"Raté. Bonne réponse : "+esc(vtLabel(q.w)))+'</p>'+
      '<div class="tr"><b>Mot</b><span class="jp" lang="ja">'+esc(q.w.jp)+'</span>'+(q.w.kan?' ('+esc(q.w.rd)+')':'')+' — '+esc(q.w.fr)+'</div>'+

  }

    '<div class="prog-l"><span>Question '+(vs.ti+1)+' sur '+total+'</span><span>Score '+vs.tscore+'</span></div>'+
    '<p class="qlabel">'+label+'</p>'+prompt+'<div class="choices rd">'+choices+'</div>'+fb+'</div>';

function vtPick(k){
  if(vs.tphase!=="run"||vs.tpick!==null)return;

  renderVocabStage(true);
}
function vtNext(){
  if(vs.tpick===null)return;
  vs.ti++;vs.tpick=null;
  if(vs.ti>=vs.tqs.length){vs.tphase="done";if(!vs.tredo)pRecord("vocab",vs.tscore,vs.tqs.length);renderVocabTop();}
  renderVocabStage();
}
function renderVocabStage(focus,anim){
  var el=$("#vocab-stage");

  if(focus&&answered&&state.tab==="gram"){var b=$("#gram-stage [data-a='gnext']");if(b)b.focus({preventScroll:true});}
}
function gStart(list){
  var pool=gpool();
  var items=list||shuffle(pool).slice(0,gs.count===0?pool.length:Math.min(gs.count,pool.length));
  if(!items.length)return;
  gs.qs=items.map(function(x){return {li:x.li,p:x.p,fr:x.fr,why:x.why,ok:x.opts[0],opts:shuffle(x.opts.slice())};});
  gs.i=0;gs.pick=null;gs.score=0;gs.wrong=[];gs.redo=!!list;gs.phase="run";
}
function gPick(k){
  if(gs.phase!=="run"||gs.pick!==null)return;
  var q=gs.qs[gs.i];gs.pick=k;
  if(q.opts[k]===q.ok)gs.score++;else gs.wrong.push(q);
  renderGramStage(true);
}
function gNext(){
  if(gs.pick===null)return;
  gs.i++;gs.pick=null;
  if(gs.i>=gs.qs.length){gs.phase="done";if(!gs.redo)pRecord("gram",gs.score,gs.qs.length);renderGramTop();}
  renderGramStage();
}
function renderGram(){renderGramTop();renderGramStage();}

var PGOAL=0.8,PWIN=30,PMIN=8;

function pRecord(a,s,n){
  if(n<PMIN)return;
  plog.push({t:Date.now(),a:a,s:s,n:n});
  if(plog.length>300)plog=plog.slice(-300);
  pSave();

function pRecordKana(){
  var by={};
  ts.qs.forEach(function(q){
    var k=q.e.script;by[k]=by[k]||{s:0,n:0};
    by[k].n++;if(ts.wrong.indexOf(q.e)<0)by[k].s++;
  });
  Object.keys(by).forEach(function(k){pRecord(k,by[k].s,by[k].n);});
}
function pStat(id){
  var rec=plog.filter(function(r){return r.a===id;}),tot=0;
  rec.forEach(function(r){tot+=r.n;});
  var n=0,s=0;
  for(var i=rec.length-1;i>=0&&n<PWIN;i--){n+=rec[i].n;s+=rec[i].s;}
  var acc=n?s/n:0;
  return {tests:rec.length,tot:tot,n:n,acc:acc,frac:n?Math.min(1,acc/PGOAL)*Math.min(1,n/PWIN):0,done:n>=PWIN&&acc>=PGOAL};
}
function pName(id){var r="";PSTEPS.forEach(function(p){if(p.id===id)r=p.t;});return r;}

  var next=null,ndone=0;

  }else{
    verdict=ndone+" étape"+(ndone>1?"s":"")+" validée"+(ndone>1?"s":"")+" sur "+st.length+". Prochaine étape : <b>"+esc(next.p.t)+"</b>. "+esc(next.p.hint);

    '<p>'+verdict+'</p>'+cta+'</div>';
  h+='<div class="ppath">'+st.map(function(x,i){
    var s=x.s,cls=s.done?"done":(s.n?"run":"");
    var pct=Math.round(s.acc*100);
    var line=s.n?('Précision récente : <b>'+pct+' %</b> sur '+s.n+' question'+(s.n>1?'s':'')+' · '+s.tests+' test'+(s.tests>1?'s':'')):'Pas encore de test.';
    var need=s.done?"Étape validée.":(s.n<PWIN?"Il faut au moins "+PWIN+" questions ("+Math.max(0,PWIN-s.n)+" de plus) et ":"Il faut ")+(s.done?"":Math.round(PGOAL*100)+" % de réussite.");
    return '<div class="pstep '+cls+'"><div class="pnum" aria-hidden="true">'+(s.done?"✓":(i+1))+'</div><div class="pbody"><h3>'+esc(x.p.t)+'</h3><small>'+esc(x.p.d)+'</small>'+
      '<div class="progress" role="progressbar" aria-label="'+esc(x.p.t)+'" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.round(s.frac*100)+'"><span style="width:'+Math.round(s.frac*100)+'%"></span></div>'+
      '<small>'+line+'<br>'+need+'</small>'+
      '<div class="actions"><button type="button" class="btn" data-a="pgo" data-v="'+x.p.tab+'">S\'entraîner</button></div></div></div>';

var NEXAM=20;
function rngOf(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function sshuffle(a,seed){var r=rngOf(seed),b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),x=b[i];b[i]=b[j];b[j]=x;}return b;}
var DAKU={"か":"が","き":"ぎ","く":"ぐ","け":"げ","こ":"ご","さ":"ざ","し":"じ","す":"ず","せ":"ぜ","そ":"ぞ","た":"だ","ち":"ぢ","つ":"づ","て":"で","と":"ど","は":"ば","ひ":"び","ふ":"ぶ","へ":"べ","ほ":"ぼ"};
var UNDAKU={};Object.keys(DAKU).forEach(function(k){UNDAKU[DAKU[k]]=k;});
function mutateRd(rd){
  var cs=rd.split(""),idx=[];
  cs.forEach(function(c,i){if(DAKU[c]||UNDAKU[c])idx.push(i);});
  if(idx.length){var i=idx[Math.floor(Math.random()*idx.length)];cs[i]=DAKU[cs[i]]||UNDAKU[cs[i]];return cs.join("");}
  if(/[おこそとのほもよろ]う/.test(rd))return rd.replace(/([おこそとのほもよろ])う/,"$1");
  return null;
}
var XSHORT=function(w){return w.fr.length<=42&&!/^(compteur|suffixe|préfixe|marque)/.test(w.fr);};
var XCNT={},XRD={};WORDS.forEach(function(w){XCNT[w.jp]=(XCNT[w.jp]||0)+1;XRD[w.rd]=(XRD[w.rd]||0)+1;});
var XK=sshuffle(WORDS.filter(function(w){return w.kan&&XSHORT(w)&&w.rd.length>=2&&XCNT[w.jp]===1&&XRD[w.rd]===1;}),7);
var XS=sshuffle(WORDS.filter(function(w){return XSHORT(w);}),11);
var XG=sshuffle(GEX,13);
var XT=sshuffle(TEXTS,17);
function xslice(arr,e,n){var out=[];for(var i=0;i<n;i++)out.push(arr[(e*n+i)%arr.length]);return out;}
function xdedupe(list,key){var seen={},out=[];list.forEach(function(w){var k=key(w);if(!seen[k]){seen[k]=1;out.push(w);}});return out;}
function xmk(sec,prompt,opts,okIdx,why,extra){var o={sec:sec,prompt:prompt,opts:opts,ok:okIdx,why:why};if(extra)for(var k in extra)o[k]=extra[k];return o;}
function xshuf(opts,okVal){var sh=shuffle(opts.slice());return {opts:sh,ok:sh.indexOf(okVal)};}
function xbuild(e){
  var qs=[];
  var kw=xdedupe(xslice(XK,e,15),function(w){return w.jp;}),m1=kw.slice(0,10),m2=kw.slice(10,15);
  var allRd=XK.map(function(w){return w.rd;});
  m1.forEach(function(w){
    var ds=[],seen={};seen[w.rd]=1;
    var mu=mutateRd(w.rd);if(mu&&!seen[mu]){seen[mu]=1;ds.push(mu);}
    shuffle(XK.filter(function(x){return Math.abs(x.rd.length-w.rd.length)<=1;})).forEach(function(x){if(ds.length<3&&!seen[x.rd]){seen[x.rd]=1;ds.push(x.rd);}});
    var s=xshuf([w.rd].concat(ds),w.rd);
    qs.push(xmk("m1",'<span class="vbig jp" lang="ja">'+esc(w.jp)+'</span>',s.opts,s.ok,w.jp+"（"+w.rd+"） : "+w.fr,{jp:true}));
  });
  m2.forEach(function(w){
    var ds=[],seen={};seen[w.jp]=1;
    var chars=w.jp.split("").filter(function(c){return /[一-鿿]/.test(c);});
    var cand=shuffle(XK.filter(function(x){return x.rd!==w.rd&&x.jp!==w.jp;}));
    cand.filter(function(x){return chars.some(function(c){return x.jp.indexOf(c)>-1;});}).forEach(function(x){if(ds.length<3&&!seen[x.jp]){seen[x.jp]=1;ds.push(x.jp);}});
    cand.filter(function(x){return x.jp.length===w.jp.length;}).forEach(function(x){if(ds.length<3&&!seen[x.jp]){seen[x.jp]=1;ds.push(x.jp);}});
    var s=xshuf([w.jp].concat(ds),w.jp);
    qs.push(xmk("m2",'<span class="vbig jp" lang="ja">'+esc(w.rd)+'</span>',s.opts,s.ok,w.rd+" s'écrit "+w.jp+" : "+w.fr,{jp:true}));
  });
  var used={};kw.forEach(function(w){used[w.jp]=1;});
  var sw=xdedupe(xslice(XS,e,14),function(w){return w.jp;}).filter(function(w){return !used[w.jp];}).slice(0,10);
  sw.forEach(function(w){
    var ds=[],seen={};seen[w.fr]=1;
    shuffle(WORDS.filter(function(x){return x.th===w.th&&XSHORT(x);})).concat(shuffle(XS)).forEach(function(x){if(ds.length<3&&!seen[x.fr]){seen[x.fr]=1;ds.push(x.fr);}});
    var s=xshuf([w.fr].concat(ds),w.fr);
    qs.push(xmk("m3",'<span class="vbig jp" lang="ja">'+esc(w.jp)+'</span>',s.opts,s.ok,w.jp+(w.kan?"（"+w.rd+"）":"")+" = "+w.fr,{jp:false}));
  });
  xslice(XG,e,10).forEach(function(g){
    var s=xshuf(g.opts,g.opts[0]);
    qs.push(xmk("m4",g.p,s.opts,s.ok,g.why+" (Leçon : "+GRAM[g.li][2]+")",{fr:g.fr,gram:true,jp:true}));
  });
  xslice(XT,e,5).forEach(function(t){
    var s=xshuf(t.opts,t.opts[0]);
    qs.push(xmk("m5",t.jp,s.opts,s.ok,t.fr,{q:t.q,text:true,furi:t.furi,jp:false}));
  });
  return qs;
}
var XSEC={
 m1:{n:"もんだい 1",t:"Lecture des kanji",d:"Choisis la bonne lecture du mot.",grp:"v"},
 m2:{n:"もんだい 2",t:"Écriture",d:"Choisis la bonne écriture en kanji du mot en hiragana.",grp:"v"},
 m3:{n:"もんだい 3",t:"Sens des mots",d:"Choisis le sens du mot en français.",grp:"v"},
 m4:{n:"もんだい 4",t:"Grammaire",d:"Choisis ce qui complète la phrase.",grp:"g"},
 m5:{n:"もんだい 5",t:"Compréhension écrite",d:"Lis le texte, puis réponds à la question.",grp:"r"}
};
var xs={sub:"chemin",phase:"list",id:0,qs:[],i:0,pick:null,ans:[],t0:0,furi:false,best:{}};
try{var xb=JSON.parse(localStorage.getItem("kk-x")||"{}");if(xb&&typeof xb==="object")xs.best=xb;}catch(e){}
function xsave(){try{localStorage.setItem("kk-x",JSON.stringify(xs.best));}catch(e){}}
function xStart(e){
  xs.id=e;xs.qs=xbuild(e);xs.i=0;xs.pick=null;xs.ans=[];xs.t0=Date.now();xs.phase="run";
}
function xPick(k){if(xs.phase!=="run"||xs.pick!==null)return;xs.pick=k;xs.ans[xs.i]=(k===xs.qs[xs.i].ok);renderExam(true);}
function xNext(){
  if(xs.pick===null)return;
  xs.i++;xs.pick=null;
  if(xs.i>=xs.qs.length)xFinish();
  renderExam();
}
function xFinish(){
  xs.phase="done";
  var sc={v:[0,0],g:[0,0],r:[0,0]};
  xs.qs.forEach(function(q,i){var g=XSEC[q.sec].grp;sc[g][1]++;if(xs.ans[i])sc[g][0]++;});
  var tot=sc.v[0]+sc.g[0]+sc.r[0],n=xs.qs.length;
  xs.res=sc;xs.mins=Math.max(1,Math.round((Date.now()-xs.t0)/60000));
  var pct=Math.round(tot/n*100),prev=xs.best[xs.id];
  if(!prev||pct>prev.pct)xs.best[xs.id]={pct:pct,t:Date.now()};
  xsave();
  plog.push({t:Date.now(),a:"vocab",s:sc.v[0],n:sc.v[1]},{t:Date.now(),a:"gram",s:sc.g[0],n:sc.g[1]},{t:Date.now(),a:"read",s:sc.r[0],n:sc.r[1]});
  pSave();
}
function xHead(q){var s=XSEC[q.sec];return '<div class="xhead"><span><b class="jp" lang="ja">'+s.n+'</b> · '+esc(s.t)+'</span><small>'+esc(s.d)+'</small></div>';}
function renderExam(focus){
  var el=$("#prog-stage");
  if(xs.phase==="list"){
    var done=Object.keys(xs.best).length;
    var h='<p class="intro">'+NEXAM+' examens blancs de 40 questions, construits sur le modèle de l\'examen N5 : lecture et écriture des kanji, sens des mots, grammaire, compréhension écrite. Chaque examen utilise des mots, des points de grammaire et des textes différents. Vise 80 % et plus.</p>'+
      '<div class="xgrid">';
    for(var e=0;e<NEXAM;e++){
      var b=xs.best[e];
      h+='<button type="button" class="xcard'+(b?" done":"")+'" data-a="xstart" data-i="'+e+'"><span class="xn">'+(e+1)+'</span><span class="xt">Examen '+(e+1)+'</span><small>'+(b?'Meilleur score : '+b.pct+' %':'Pas encore fait')+'</small></button>';
    }
    h+='</div><p class="intro">'+done+' examen'+(done>1?'s':'')+' fait'+(done>1?'s':'')+' sur '+NEXAM+'.</p>';
    el.innerHTML='<div class="stage wide" style="gap:20px">'+h+'</div>';
    return;
  }
  if(xs.phase==="done"){
    var n=xs.qs.length,tot=xs.res.v[0]+xs.res.g[0]+xs.res.r[0],pct=Math.round(tot/n*100);
    var rows=[["Vocabulaire (もんだい 1 à 3)",xs.res.v],["Grammaire (もんだい 4)",xs.res.g],["Compréhension écrite (もんだい 5)",xs.res.r]].map(function(r){
      var p=r[1][1]?Math.round(r[1][0]/r[1][1]*100):0;
      return '<div class="xrow"><span>'+r[0]+'</span><b>'+r[1][0]+' / '+r[1][1]+'</b><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+p+'"><span style="width:'+p+'%"></span></div></div>';
    }).join("");
    var msg=pct>=80?"Très bon score : tu es au niveau visé.":pct>=60?"Bien, mais il reste des points à consolider avant l'examen.":"À retravailler : repasse par les leçons et les flashcards, puis refais un examen.";
    var wrong=xs.qs.map(function(q,i){return xs.ans[i]?"":'<div class="mt"><small>'+esc(XSEC[q.sec].t)+'</small><div>'+esc(q.opts[q.ok])+'</div><small>'+esc(q.why)+'</small></div>';}).join("");
    el.innerHTML='<div class="stage wide" style="gap:20px"><div class="result"><div class="score"><span class="big">'+tot+'</span><span>sur '+n+' ('+pct+' %) · '+xs.mins+' min</span></div><p>'+msg+'</p>'+rows+
      (wrong?'<h3>Corrections</h3><div class="mlist">'+wrong+'</div>':'')+
      '<div class="actions"><button type="button" class="btn primary" data-a="xstart" data-i="'+xs.id+'">Refaire cet examen</button><button type="button" class="btn" data-a="xlist">Tous les examens</button></div></div></div>';
    return;
  }
  var q=xs.qs[xs.i],total=xs.qs.length,answered=xs.pick!==null;
  var showFuri=xs.furi||(q.text&&q.furi);
  var promptHTML;
  if(q.gram)promptHTML='<div class="gq txt jp'+(xs.furi?"":" nofuri")+'" lang="ja">'+gfmt(q.prompt.replace("＿＿","@@B@@")).replace("@@B@@",answered?'<span class="blank">'+esc(q.opts[q.ok])+'</span>':'<span class="blank">　　</span>')+'</div>'+(answered?'<p style="text-align:center;color:var(--muted);margin:0">'+esc(q.fr)+'</p>':'');
  else if(q.text)promptHTML='<div class="paper"><div class="txt jp'+(showFuri?"":" nofuri")+'" lang="ja">'+rubyOf(q.prompt)+'</div></div><p class="qlabel">'+esc(q.q)+'</p>';
  else promptHTML='<div class="prompt">'+q.prompt+'</div>';
  var choices=q.opts.map(function(o,idx){
    var cls=answered?(idx===q.ok?" ok":(idx===xs.pick?" ko":" dim")):"";
    var cn=q.text?"t":"t jp"+(o.length>6?" sm":"");
    return '<button type="button" class="choice'+cls+'" data-a="xpick" data-k="'+idx+'"><span class="n">'+(idx+1)+'</span><span class="'+(q.sec==="m3"?"t":cn)+'"'+(q.sec==="m3"||q.text?"":' lang="ja"')+'>'+esc(o)+'</span></button>';
  }).join("");
  var fb="";
  if(answered){
    var good=xs.pick===q.ok;
    fb='<p class="fb '+(good?"ok":"ko")+'" role="status">'+(good?"Correct.":"Raté. Bonne réponse : "+esc(q.opts[q.ok]))+'</p><div class="tr"><b>Explication</b>'+esc(q.why)+'</div>'+
      '<div class="actions"><button type="button" class="btn primary" data-a="xnext">'+(xs.i===total-1?"Voir le résultat":"Question suivante")+'</button></div>';
  }
  el.innerHTML='<div class="stage wide">'+
    '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="'+total+'" aria-valuenow="'+xs.i+'"><span style="width:'+(xs.i/total*100)+'%"></span></div>'+
    '<div class="prog-l"><span>Examen '+(xs.id+1)+' · question '+(xs.i+1)+' sur '+total+'</span><button type="button" class="chip" data-a="xlist">Quitter</button></div>'+
    xHead(q)+promptHTML+(q.sec==="m3"||q.sec==="m4"?'':'')+'<div class="choices rd">'+choices+'</div>'+fb+
    (q.text||q.gram?'<div class="rtools"><button type="button" class="chip" data-a="xfuri" aria-pressed="'+xs.furi+'"><span class="fk" aria-hidden="true">ふ</span>Furigana</button></div>':'')+'</div>';
  if(focus&&answered){var b=$("#prog-stage [data-a='xnext']");if(b)b.focus({preventScroll:true});}
}

/* ---------- Onglets et événements ---------- */
function setTab(t){
  state.tab=t;save();
  if(t==="prog")renderProg();
  ["learn","cards","test","vocab","gram","prog","read"].forEach(function(id){
    $("#view-"+id).hidden=id!==t;
    var b=$("#t-"+id);b.setAttribute("aria-selected",String(id===t));b.tabIndex=id===t?0:-1;
  });
}
document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-a]");if(!b)return;
  var a=b.dataset.a,v=b.dataset.v;
  if(a==="tab")setTab(v);
  else if(a==="learn"){state.learn=v;renderLearn();}
  else if(a==="toggle")toggleSet(b.dataset.set);
  else if(a==="cdir"){cs.dir=v;renderCardsTop();cardsReset();renderCardsStage();}
  else if(a==="flip"){if(cs.phase==="run"){cs.flipped=!cs.flipped;renderCardsStage(true,true);}}
  else if(a==="know")mark(true);
  else if(a==="miss")mark(false);
  else if(a==="credo"){cardsReset(shuffle(cs.missed));renderCardsStage(true);}
  else if(a==="crestart"){cardsReset();renderCardsStage(true);}
  else if(a==="tcount"){ts.count=parseInt(v,10);renderTestStage();}
  else if(a==="tdir"){ts.dir=v;renderTestStage();}
  else if(a==="tstart"){tStart();renderTestTop();renderTestStage();}
  else if(a==="tpick")tPick(parseInt(b.dataset.k,10));
  else if(a==="tnext")tNext();
  else if(a==="tredo"){tStart(shuffle(ts.wrong));renderTestStage();}
  else if(a==="tnew"){ts.phase="setup";renderTestStage();}
  else if(a==="rfilter"){rs.filter=v;renderReadStage();}
  else if(a==="rcount"){rs.count=parseInt(v,10);renderReadStage();}
  else if(a==="rstart"){rStart();renderReadStage();}
  else if(a==="rpick")rPick(parseInt(b.dataset.k,10));
  else if(a==="rnext")rNext();
  else if(a==="rfuri")rFuri();
  else if(a==="rredo"){rStart(shuffle(rs.wrong));renderReadStage();}
  else if(a==="rnew"){rs.phase="setup";renderReadStage();}
  else if(a==="vsub"){vs.sub=v;vsave();if(v==="test"&&vs.tphase==="done")vs.tphase="setup";renderVocab();}
  else if(a==="vpicktoggle"){vs.pickOpen=!vs.pickOpen;renderVocabTop();}
  else if(a==="vtheme"){var ti=parseInt(b.dataset.i,10),tk=vs.themes.indexOf(ti);if(tk>-1)vs.themes.splice(tk,1);else vs.themes.push(ti);vThemesChanged();}
  else if(a==="vall"){vs.themes=THEMES.map(function(t,i){return i;});vThemesChanged();}
  else if(a==="vnone"){vs.themes=[];vThemesChanged();}
  else if(a==="vfuri"){vs.furi=(v==="1");vsave();renderVocab();}
  else if(a==="vcdir"){vs.cdir=v;vcardsReset();renderVocab();}
  else if(a==="vflip"){if(vs.cphase==="run"){vs.cflip=!vs.cflip;renderVocabStage(true,true);}}
  else if(a==="vknow")vmark(true);
  else if(a==="vmiss")vmark(false);
  else if(a==="vredo"){vcardsReset(shuffle(vs.cmiss));renderVocabStage(true);}
  else if(a==="vrestart"){vcardsReset();renderVocabStage(true);}
  else if(a==="vtdir"){vs.tdir=v;renderVocabStage();}
  else if(a==="vtcount"){vs.tcount=parseInt(v,10);renderVocabStage();}
  else if(a==="vtstart"){vtStart();renderVocabTop();renderVocabStage();}
  else if(a==="vtpick")vtPick(parseInt(b.dataset.k,10));
  else if(a==="vtnext")vtNext();
  else if(a==="vtredo"){vtStart(shuffle(vs.twrong));renderVocabTop();renderVocabStage();}
  else if(a==="vtnew"){vs.tphase="setup";renderVocab();}
  else if(a==="gsub"){gs.sub=v;gsave();if(v==="test"&&gs.phase==="done")gs.phase="setup";renderGram();}
  else if(a==="gfuri"){gs.furi=(v==="1");gsave();renderGram();}
  else if(a==="gscope"){gs.scope=v;renderGramStage();}
  else if(a==="gcount"){gs.count=parseInt(v,10);renderGramStage();}
  else if(a==="gstart"){gStart();renderGram();}
  else if(a==="glesson"){gs.sub="test";gs.scope="L:"+b.dataset.i;gs.count=0;gStart();gsave();renderGram();window.scrollTo(0,0);}
  else if(a==="gpick")gPick(parseInt(b.dataset.k,10));
  else if(a==="gnext")gNext();
  else if(a==="gredo"){gStart(shuffle(gs.wrong.map(function(q){return {li:q.li,p:q.p,fr:q.fr,why:q.why,opts:[q.ok].concat(q.opts.filter(function(o){return o!==q.ok;}))};})));renderGram();}
  else if(a==="gnew"){gs.phase="setup";renderGram();}
  else if(a==="pgo"){setTab(v);window.scrollTo(0,0);}
  else if(a==="xsub"){xs.sub=v;if(xs.phase!=="run")xs.phase="list";renderProg();}
  else if(a==="xstart"){xs.sub="exam";xStart(parseInt(b.dataset.i,10));renderProg();window.scrollTo(0,0);}
  else if(a==="xpick")xPick(parseInt(b.dataset.k,10));
  else if(a==="xnext"){xNext();if(xs.phase==="done")renderProg();}
  else if(a==="xlist"){xs.phase="list";renderProg();}
  else if(a==="xfuri"){xs.furi=!xs.furi;renderExam();}
  else if(a==="preset"){if(pconfirm){plog=[];pSave();pconfirm=false;}else pconfirm=true;renderProg();}
  else if(a==="pcancel"){pconfirm=false;renderProg();}
});
document.addEventListener("change",function(ev){
  if(ev.target.id==="c-shuffle"){cs.shuffle=ev.target.checked;cardsReset();renderCardsStage();}
  if(ev.target.id==="v-shuffle"){vs.cshuffle=ev.target.checked;vcardsReset();renderVocabStage();}
});
document.addEventListener("input",function(ev){
  if(ev.target.id==="kq"){state.q=ev.target.value;fillKanji();}
  if(ev.target.id==="vq"){vs.q=ev.target.value;fillVocabList();}
});
document.addEventListener("keydown",function(ev){
  if(ev.metaKey||ev.ctrlKey||ev.altKey)return;
  var t=ev.target;if(t&&t.matches&&t.matches("input,select,textarea"))return;
  if(state.tab==="cards"&&cs.phase==="run"&&cs.flipped){
    if(ev.key==="ArrowRight"){ev.preventDefault();mark(true);}
    else if(ev.key==="ArrowLeft"){ev.preventDefault();mark(false);}
  }else if(state.tab==="test"&&ts.phase==="run"&&ts.picked===null){
    var k=parseInt(ev.key,10);
    if(k>=1&&k<=4){ev.preventDefault();tPick(k-1);}
  }else if(state.tab==="read"&&rs.phase==="run"&&rs.picked===null){
    var r=parseInt(ev.key,10);
    if(r>=1&&r<=4){ev.preventDefault();rPick(r-1);}
  }else if(state.tab==="vocab"&&vs.sub==="cards"&&vs.cphase==="run"&&vs.cflip){
    if(ev.key==="ArrowRight"){ev.preventDefault();vmark(true);}
    else if(ev.key==="ArrowLeft"){ev.preventDefault();vmark(false);}
  }else if(state.tab==="vocab"&&vs.sub==="test"&&vs.tphase==="run"&&vs.tpick===null){
    var vk=parseInt(ev.key,10);
    if(vk>=1&&vk<=4){ev.preventDefault();vtPick(vk-1);}
  }else if(state.tab==="prog"&&xs.sub==="exam"&&xs.phase==="run"&&xs.pick===null){
    var xk=parseInt(ev.key,10);
    if(xk>=1&&xk<=4){ev.preventDefault();xPick(xk-1);}
  }else if(state.tab==="gram"&&gs.sub==="test"&&gs.phase==="run"&&gs.pick===null){
    var gk=parseInt(ev.key,10);
    if(gk>=1&&gk<=4){ev.preventDefault();gPick(gk-1);}
  }
});

/* ---------- Démarrage ---------- */
cardsReset();
vcardsReset();
renderLearn();renderCardsTop();renderCardsStage();renderTestTop();renderTestStage();renderReadStage();renderVocab();renderGram();
setTab(state.tab);
})();
</script>
